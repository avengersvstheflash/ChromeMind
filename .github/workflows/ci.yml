name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Validate Manifest & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest.json
        run: node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); if (!manifest.name || !manifest.version || manifest.manifest_version !== 3) { throw new Error('Invalid manifest.json'); } console.log('manifest.json is valid MV3: v' + manifest.version);"

      - name: Run lint (syntax validation)
        run: npm run lint

      - name: Run automated tests
        run: npm test
